<svg xmlns="http://www.w3.org/2000/svg" width="608" height="641" viewBox="0 0 608 641" role="img" aria-label="Vectorized circular proxy rotation logo">
  <defs>
    <linearGradient id="blueCyan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22c7dc"/>
      <stop offset="1" stop-color="#176cf4"/>
    </linearGradient>
    <linearGradient id="cyanBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22c7dc"/>
      <stop offset="1" stop-color="#176cf4"/>
    </linearGradient>
    <linearGradient id="nodeGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#24c3da"/>
      <stop offset="1" stop-color="#176cf4"/>
    </linearGradient>
    <linearGradient id="darkGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#09215a"/>
      <stop offset="1" stop-color="#07194d"/>
    </linearGradient>
  </defs>

  <!-- Outer rotating arrows -->
  <path d="M 69 400 A 267 267 0 0 1 439 84" fill="none" stroke="url(#cyanBlue)" stroke-width="32" stroke-linecap="butt"/>
  <polygon points="464,42 492,128 394,119 437,70" fill="url(#cyanBlue)" stroke="#d9efff" stroke-width="1" stroke-linejoin="round"/>

  <path d="M 512 153 A 267 267 0 0 1 246 561" fill="none" stroke="url(#blueCyan)" stroke-width="32" stroke-linecap="butt"/>
  <polygon points="185,520 282,518 224,603" fill="url(#blueCyan)" stroke="#d9efff" stroke-width="1" stroke-linejoin="round"/>

  <!-- Inner graph/network links -->
  <polygon points="227,249 247,258 187,389 167,380" fill="url(#darkGrad)" stroke="#d9efff" stroke-width="0.8"/>
  <polygon points="329,220 417,267 407,286 319,239" fill="url(#darkGrad)" stroke="#d9efff" stroke-width="0.8"/>
  <polygon points="210,413 408,328 418,348 217,436" fill="url(#darkGrad)" stroke="#d9efff" stroke-width="0.8"/>

  <!-- Nodes -->
  <circle cx="267" cy="193" r="48" fill="url(#nodeGrad)" stroke="#d9efff" stroke-width="1"/>
  <circle cx="148" cy="445" r="48" fill="url(#nodeGrad)" stroke="#d9efff" stroke-width="1"/>
  <circle cx="472" cy="306" r="48" fill="url(#nodeGrad)" stroke="#d9efff" stroke-width="1"/>
</svg>
